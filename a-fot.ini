# A-FOT 配置模板
# 首次使用 AutoCFGO 时，建议优先修改以下字段：
#   opt_mode、work_path、compiler、compiler_path、application_name、
#   bin_file、build_script、run_script、perf_time、max_waiting_time
# 文件和目录请使用绝对路径。

# ------------------------------
# 通用配置
# ------------------------------

# 优化模式：AutoFDO / AutoBOLT / AutoPGO / Auto_kernel_PGO / AutoCFGO
opt_mode=AutoCFGO

# 日志、profile 和编译器 wrapper 的工作目录。
work_path=/home/workspace

# 应用运行脚本。
# 脚本运行时长应覆盖采样窗口（perf_time）。
# perf_time=0 表示不限时长，采样会持续到目标进程退出。
run_script=/home/workspace/run.sh

# 编译器工具链：gcc 或 llvm。
# 第一阶段的 AutoCFGO 推荐使用 gcc。
compiler=gcc

# 编译器路径：其下应包含 bin/ 和 lib*/ 目录。
compiler_path=/home/workspace/gcc-12.3.1-2025.06-aarch64-linux

# ------------------------------
# AutoCFGO / AutoFDO / AutoBOLT / AutoPGO
# 应用优化最小必填项
# ------------------------------

# 目标进程名。
# 请填写最终运行时的真实进程名，例如 mysqld。
application_name=mysqld

# 目标优化二进制。
# 请填写构建产出的最终 ELF 可执行文件路径。
bin_file=/home/workspace/mysql-cfgo/bin/mysqld

# 仅对 AutoCFGO 生效的稳定源码根路径。
# A-FOT 会为 AutoCFGO 构建注入：-fprofile-prefix-path=<stable_root>
# 这样在“采样构建”和“复用构建”工作区绝对路径不一致时，仍可按统一前缀匹配 profile。
# 建议填写“实际源码/构建绝对路径的公共前缀”，例如 /home/workspace/。
# 如果该值不是当前编译路径的真实前缀，GCC 会提示 "does not start with profile prefix"，
# 路径归一化也不会生效。留空表示不注入该参数。
stable_root=/home/workspace/

# 仅对 AutoCFGO 生效的目录备份列表。
# 用冒号分隔多个绝对路径，A-FOT 会在 03-build-cfgo-pgo 和 05-build-cfgo-cspgo 后
# 将这些目录分别归档到本次运行目录的 artifacts/cleanup-backups/ 下。
# 适合填写会被后续 build_script/run_script 清理或重建的输出目录，例如构建目录、安装目录。
# 留空表示不做目录归档。
cleanup_backup_dirs=

# 仅对 AutoCFGO 生效的起始子阶段。
# 留空或填写 01-build-raw 表示从头开始。
# 若填写其他阶段，A-FOT 会自动跳过前面的子阶段，并在 opt.log / run-summary.txt 中记录本次从哪个阶段开始。
# 可选值：
#   01-build-raw
#   02-run-raw
#   03-build-cfgo-pgo
#   04-run-cfgo-pgo
#   05-build-cfgo-cspgo
#   06-run-cfgo-cspgo
#   07-bolt-instrument
#   08-run-bolt
#   09-bolt-optimize
start_substage=

# 完整的应用构建脚本。
# 该脚本应能完成完整构建，并生成 bin_file 指向的文件。
build_script=/home/workspace/build.sh

# 等待目标进程出现的最长时间（秒）。
max_waiting_time=600

# 采样时长（秒），0 表示不限时长（采样持续到目标进程退出）。
perf_time=0

# 是否检查构建过程中是否实际命中优化参数。
# 1 = 启用，0 = 禁用
check_success=1

# 构建模式：Wrapper 或 Bear。
# 首次接入建议优先使用 Wrapper。
build_mode=Wrapper

# ------------------------------
# Auto_kernel_PGO 高级配置
# 仅在内核 PGO 模式下使用
# ------------------------------

# 内核 PGO 模式：arc = 仅启用 ARC profile，all = 启用完整 PGO 优化
pgo_mode=all

# 内核 PGO 阶段：1 = 编译插桩内核，2 = 编译优化内核
pgo_phase=1

# 内核源码目录。如果留空，A-FOT 会尝试自动下载。
kernel_src=/opt/kernel

# 内核本地版本名。A-FOT 会根据阶段追加 "-pgoing" 或 "-pgoed" 后缀。
kernel_name=kernel

# 额外的内核配置项。
# 请确保自定义值合法，且不会导致内核编译失败。
#CONFIG_...=y

# 重启后继续同一轮流程时使用的上一次运行目录时间戳。
last_time=

# “不自动编译内核”场景下使用的内核 Makefile 路径。
makefile=

# “不自动编译内核”场景下使用的内核配置文件路径。
kernel_config=

# “不自动编译内核”场景下使用的原始内核 profile 目录。
data_dir=
